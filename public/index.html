<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#090a0b">
    <meta name="description" content="Mesh. A motion study by Dan Dekker.">
    <title>Mesh — Dan Dekker</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/style.css">
    <script type="module" src="/main.js"></script>
  </head>
  <body>
    <mesh-app>
      <main class="gallery" aria-label="Mesh, an interactive motion study">
        <particle-field aria-label="Interactive particle sculpture. Move to disturb, drag to pull, click to ripple." tabindex="0"></particle-field>
        <header class="masthead">
          <a class="wordmark" href="/" aria-label="Mesh home">mesh<span class="wordmark-dot">.</span></a>
          <span class="edition">STUDY <span class="edition-number">001</span></span>
          <a class="author" href="https://github.com/DanDekker" target="_blank" rel="noopener noreferrer">Dan Dekker <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 15 15 5M5 5h10v10"/></svg></a>
        </header>
        <div class="side-label" aria-hidden="true"><span>FORM /</span> <span data-form-label>01 — SILK</span></div>
        <div class="coordinate coordinate-top" aria-hidden="true"><i></i><span>Y</span></div>
        <div class="coordinate coordinate-bottom" aria-hidden="true"><i></i><span>X</span></div>
        <div class="field-caption" aria-hidden="true"><span class="caption-rule"></span><span data-caption>SILK, IN CONTINUOUS MOTION</span></div>
        <div class="field-message" role="status" aria-live="polite"></div>
        <footer class="gallery-bottom">
          <div class="quiet-meta"><span class="status-light"></span><span data-state>IN MOTION</span><span class="meta-divider">/</span><span class="edition-year">2026</span></div>
          <mesh-controls>
            <div class="control-surface">
              <div class="forms" role="group" aria-label="Sculpture form">
                <button class="form-button active" data-form="silk" aria-pressed="true"><span class="form-number">01</span> Silk</button>
                <button class="form-button" data-form="orbit" aria-pressed="false"><span class="form-number">02</span> Orbit</button>
                <button class="form-button" data-form="wave" aria-pressed="false"><span class="form-number">03</span> Wave</button>
              </div>
              <span class="control-divider" aria-hidden="true"></span>
              <div class="transport">
                <button class="icon-button" data-action="pause" aria-label="Pause motion" aria-pressed="false" title="Pause · Space"><svg class="pause-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="M7 5v10M13 5v10"/></svg><svg class="play-icon" viewBox="0 0 20 20" aria-hidden="true"><path d="m7 4 9 6-9 6z"/></svg></button>
                <button class="icon-button" data-action="reset" aria-label="Reset sculpture" title="Reset · R"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4.5 7a6 6 0 1 1-.4 4M4 3.5V8h4.5"/></svg></button>
                <button class="icon-button" data-action="settings" aria-label="Adjust field" aria-expanded="false" aria-controls="field-settings" title="Adjust field"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 5h12M4 10h12M4 15h12M7 3v4M13 8v4M8 13v4"/></svg></button>
              </div>
            </div>
            <div class="settings-panel" id="field-settings" hidden>
              <div class="settings-heading"><span>THE FIELD</span><button class="icon-button close-settings" data-action="settings" aria-label="Close field settings"><svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5 5 10 10M15 5 5 15"/></svg></button></div>
              <label class="slider-label" for="turbulence">Turbulence <output for="turbulence" data-output="turbulence">32%</output></label>
              <input id="turbulence" type="range" min="0" max="100" value="32" data-setting="turbulence">
              <label class="slider-label" for="tension">Tension <output for="tension" data-output="tension">65%</output></label>
              <input id="tension" type="range" min="0" max="100" value="65" data-setting="tension">
              <div class="palette-row"><span>Light</span><div class="swatches" role="group" aria-label="Light color"><button class="swatch copper active" data-palette="copper" aria-label="Copper light" aria-pressed="true"></button><button class="swatch silver" data-palette="silver" aria-label="Silver light" aria-pressed="false"></button><button class="swatch glacial" data-palette="glacial" aria-label="Glacial light" aria-pressed="false"></button></div></div>
              <button class="fullscreen-button" data-action="fullscreen">Fill the screen <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7 3H3v4M13 3h4v4M3 13v4h4M17 13v4h-4"/></svg></button>
            </div>
          </mesh-controls>
          <div class="interaction-hint"><span class="hint-desktop">MOVE TO DISTURB</span><span class="hint-touch">TOUCH TO DISTURB</span><svg viewBox="0 0 20 20" aria-hidden="true"><path d="M10 3v14M3 10h14"/></svg></div>
        </footer>
        <noscript><p class="noscript-note">Enable JavaScript to see Mesh in motion.</p></noscript>
      </main>
    </mesh-app>
  </body>
</html>
