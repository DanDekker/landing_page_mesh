<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#090a0b">
    <meta name="description" content="Mesh. A motion study by Dan Dekker.">
    <title>Mesh — Dan Dekker</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/style.css">
    <script type="module" src="/main.js"></script>
  </head>
  <body>
    <mesh-app>
      <main class="gallery" aria-label="Mesh, an interactive motion study">
        <particle-field aria-label="Interactive particle sculpture. Move to disturb, drag to pull, click to ripple." tabindex="0"></particle-field>
        <header class="masthead">
          <a class="wordmark" href="/" aria-label="Mesh home">mesh<span class="wordmark-dot">.</span></a>
          <a class="author" href="https://github.com/DanDekker" target="_blank" rel="noopener noreferrer">GitHub <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 15 15 5M5 5h10v10"/></svg></a>
        </header>
        <div class="sr-only field-message" role="status" aria-live="polite"></div>
        <footer class="gallery-bottom">
          <mesh-controls>
            <div class="control-surface">
              <div class="forms" role="group" aria-label="Sculpture form">
                <button class="form-button active" data-form="silk" aria-pressed="true">Silk</button>
                <button class="form-button" data-form="orbit" aria-pressed="false">Orbit</button>
                <button class="form-button" data-form="wave" aria-pressed="false">Wave</button>
                <button class="form-button" data-form="knot" aria-pressed="false">Knot</button>
              </div>
            </div>
          </mesh-controls>
        </footer>
      </main>
    </mesh-app>
  </body>
</html>
